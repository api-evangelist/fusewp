note: >-
  FuseWP publishes no client SDK for any API of its own — the plugin IS the
  distributed artifact, and it is an API consumer rather than an API producer.
  The only public registry distribution is the free "Lite" build in the
  WordPress.org plugin repository. The commercial Pro build (versioned 2.1.x in
  lockstep with the 1.1.x Lite build) is distributed only to license holders
  from fusewp.com/account/ and has no public registry entry, so no version can
  be read for it from a registry endpoint. Deliberately NOT wired as
  `type: SDKs` — a WordPress plugin distribution is not a client library for an
  API, and claiming one would inflate the ergonomics sdk_count check.
