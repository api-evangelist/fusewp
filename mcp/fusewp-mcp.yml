note: >-
  FuseWP serves a live MCP endpoint from its own host, discovered through RFC
  9728 OAuth Protected Resource Metadata rather than through any documentation —
  the provider does not mention MCP anywhere on fusewp.com. The server is the
  WordPress MCP Adapter running on FuseWP's WordPress site (fusewp.com), so its
  tools project the SITE's WordPress abilities, not the FuseWP plugin's
  user-sync feature set. Two server routes are registered under the `mcp`
  namespace. Both return 401 to an anonymous `tools/list`, so the real tool list
  and its inputSchemas require an authenticated OAuth introspection that this
  pipeline does not perform. No tool list is recorded here because none was
  observed; a guessed one would be fabrication.
servers:
