aid: fusewp
name: FuseWP
description: 'FuseWP is a WordPress automation plugin from the FuseWP Team (ProperFraction)
  that synchronizes WordPress users, customers, members and form leads with more than
  thirty email marketing platforms and CRMs — including Mailchimp, ActiveCampaign,
  Constant Contact, HubSpot, Klaviyo, Brevo, MailerLite, Salesforce, Zoho CRM, Keap,
  AWeber, GoHighLevel, SendPulse and Google Sheets. It maps WordPress user roles,
  WooCommerce/EDD orders, LMS enrollments (LearnDash, LifterLMS, Tutor LMS, Sensei),
  membership plugins (MemberPress, Paid Memberships Pro, Restrict Content Pro) and
  form submissions (Contact Form 7, Gravity Forms, WPForms, Fluent Forms) to lists,
  tags and custom fields in the connected platform. FuseWP is primarily an API
  CONSUMER rather than an API producer: the plugin runs self-hosted inside the
  customer''s WordPress installation and registers no REST routes of its own. Its
  one first-party HTTP surface is a hosted OAuth broker at auth.fusewp.com that
  holds FuseWP''s OAuth client credentials and brokers the authorization-code and
  refresh-token exchange for the eleven partner platforms that require OAuth.'
