x-enrichment:
  date: '2026-08-12'
  status: enriched
  artifacts_added: 15
  pass: local-v1
  note: >-
    FuseWP publishes no OpenAPI and its plugin registers zero REST routes, but
    STEP 0b contract discovery found two genuine first-party HTTP surfaces the
    provider never documents anywhere — an undocumented OAuth broker at
    auth.fusewp.com (eleven live integration paths, with the delegated scope set
    readable straight off each 302 Location header) and an OAuth-gated MCP
    endpoint on fusewp.com advertised through RFC 8414 and RFC 9728 well-known
    metadata. Declaring "no spec" after only checking fusewp.com/openapi.json
    would have missed both.
  evidence:
  - url: https://auth.fusewp.com/mailchimp
    status: 302
  - url: https://fusewp.com/.well-known/oauth-authorization-server/
    status: 200
  - url: https://fusewp.com/wp-json/mcp/mcp-oauth-server
    status: 401
  - url: https://fusewp.com/openapi.json
    status: 404
