  contract. There is no versioned API surface to deprecate, so RFC 8594
  Sunset/Deprecation headers are not applicable rather than missing. The
  provider publishes no status page and no deprecation policy — both were
  probed and both are absent. Recorded so the gap is legible instead of
  inferred.
