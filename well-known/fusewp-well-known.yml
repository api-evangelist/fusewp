  Authorization Server Metadata and RFC 9728 OAuth Protected Resource Metadata,
  both of which resolve (via a 301 to the trailing-slash form) to genuine JSON
  and both of which advertise the `mcp` scope and the MCP endpoint at
  https://fusewp.com/wp-json/mcp/mcp-oauth-server. These are emitted by the
