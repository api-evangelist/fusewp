  purpose-built FuseWP identity service — but the provider does serve them from
  its own host, which is what the pointer asserts. No security.txt, no
  openid-configuration, no api-catalog, no ai-plugin.json and no agent card on
  either host. The OAuth broker host auth.fusewp.com serves no /.well-known/
  surface at all.
